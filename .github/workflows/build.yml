name: Build iOS App with Theos (IPA & DEB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect files (Debug)
        run: |
          echo "=== Root Files ==="
          ls -la

      - name: Install Dependencies
        run: |
          brew install lz4 xz p7zip

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make clean package FINALPACKAGE=1

      - name: Package .app into .ipa for TrollStore / SideStore
        run: |
          mkdir -p Payload
          APP_PATH=$(find .theos/obj -name "*.app" | head -n 1)

          if [ -n "$APP_PATH" ]; then
            echo "Found .app at $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r -9 app-release.ipa Payload
          else
            echo "No .app bundle found in .theos/obj. Skipping IPA packaging."
          fi

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb

      - name: Upload IPA Artifact
        if: hashFiles('app-release.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ipa-package
          path: app-release.ipa
