name: Build IPA for TrollStore & SideStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (M1/M2)runner для быстрой сборки

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild clean build \
            -project *.xcodeproj \
            -scheme "$(xcodebuild -list -json | jq -r '.project.schemes[0]')" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          # Находим скомпилированное .app приложение и копируем его в Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          
          # Упаковываем в .ipa
          zip -r -9 app-release.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-SideStore-App
          path: app-release.ipa
