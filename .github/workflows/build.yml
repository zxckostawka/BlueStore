name: Build Simple iOS App to IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Executable
        run: |
          xcodebuild clean build \
            -scheme BlueStore \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create .app Bundle and Package to IPA
        run: |
          # 1. Находим скомпилированный исполняемый файл (бинарник)
          EXEC_PATH=$(find build/Build/Products -name "BlueStore" -type f ! -name "*.swiftmodule" | head -n 1)

          if [ -z "$EXEC_PATH" ]; then
            echo "::error::Бинарный файл BlueStore не найден!"
            exit 1
          fi

          echo "Found executable at: $EXEC_PATH"

          # 2. Создаем структуру .app внутри Payload
          mkdir -p Payload/BlueStore.app

          # 3. Копируем исполняемый файл
          cp "$EXEC_PATH" Payload/BlueStore.app/BlueStore
          chmod +x Payload/BlueStore.app/BlueStore

          # 4. Создаем Info.plist, если его нет
          if [ -f "build/info.plist" ]; then
            cp "build/info.plist" Payload/BlueStore.app/Info.plist
          else
            cat <<EOF > Payload/BlueStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>BlueStore</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.bluestore</string>
              <key>CFBundleName</key>
              <string>BlueStore</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF
          fi

          # 5. Упаковываем в .ipa
          zip -r -9 app-release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
