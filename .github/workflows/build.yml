name: Build Simple iOS App to IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild clean build \
            -scheme BlueStore \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          # 1. Находим скомпилированное .app приложение в любой подпапке build
          APP_PATH=$(find build -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Приложение .app не найдено в папке build!"
            echo "=== Содержимое папки build ==="
            find build -maxdepth 4
            exit 1
          fi

          echo "Найдено приложение: $APP_PATH"

          # 2. Создаем Payload и копируем .app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 3. Упаковываем в .ipa
          zip -r -9 app-release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
